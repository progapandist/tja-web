<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<base href="/">
<meta name="description" content="German prefix verbs as a one-armed bandit: two reels, prefixes and stems, that filter each other.">
<title>tja — German prefix verbs</title>
<!--seo: the build replaces this line with the canonical, the hreflang set,
     the social cards and the structured data for whichever locale it is
     writing. Kept as a marker so the head stays readable in source. -->
<!--seo-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎰</text></svg>">
<script>
  // Applied before the first paint, so the page never flashes the wrong theme.
  try {
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<!-- The browser would otherwise only learn about data.js once it has parsed
     app.js, and about verbs.txt once it has run data.js: three round trips
     before the largest file is even asked for. -->
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="data.js">
<link rel="modulepreload" href="strings.js">
<script>
  // Starting the fetch here rather than preloading it keeps the download off
  // the critical path without depending on how a browser matches a preload
  // hint to the request that follows it. app.js awaits this same promise.
  globalThis.verbsText = fetch("/verbs.txt").then((r) => r.text());
  // Literal per-locale paths, not a template built from the locale segment,
  // so stamp.js's string replacement can put a content hash on each one.
  const overlays = { ru: "/verbs.ru.txt", fr: "/verbs.fr.txt" };
  const overlay = overlays[location.pathname.split("/")[1]];
  if (overlay) globalThis.verbsOverlay = fetch(overlay).then((r) => r.text());
</script>
</head>
<body>
<header>
  <h1><span class="marks" aria-hidden="true"><i class="circle"></i><i class="triangle"></i><i class="square"></i></span>tja<span class="count" id="count"></span></h1>
  <div class="find">
    <input id="q" type="search" placeholder="Search verbs and meanings…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Search verbs and meanings" role="combobox" aria-expanded="false" aria-controls="hits" aria-autocomplete="list">
    <ul id="hits" role="listbox" aria-label="Search results" hidden></ul>
  </div>
  <nav class="locale" id="locale" aria-label="Language"></nav>
  <button id="theme" class="theme" type="button" aria-label="Switch theme"></button>
  <a class="contrib" id="all-verbs" href="/verbs/">all verbs</a>
  <a class="contrib nerdy" href="https://github.com/progapandist/tja" target="_blank" rel="noopener"><span class="wide-only">nerdy version for your terminal ↗</span><span class="narrow-only">terminal ↗</span></a>
  <a class="contrib" id="contribute" href="https://github.com/progapandist/tja-web" target="_blank" rel="noopener">contribute ↗</a>
</header>

<main>
  <section class="machine">
    <div class="labels"><span id="t-prefix">prefix</span><span id="t-stem">stem</span></div>
    <div class="reels">
      <div class="reel" id="prefix" tabindex="0" role="listbox" aria-label="Prefixes"><div class="strip" lang="de"></div></div>
      <div class="reel" id="stem" tabindex="0" role="listbox" aria-label="Stems"><div class="strip" lang="de"></div></div>
      <div class="window" aria-hidden="true"></div>
    </div>
  </section>

  <article class="card" id="card" aria-live="polite"></article>
</main>

<footer>
  <button id="test" class="primary" type="button">I’m feeling lucky <kbd>t</kbd></button>
  <button id="spin" type="button">Random verb <kbd>space</kbd></button>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
