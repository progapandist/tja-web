    color: #1d1c19;
    font: 16px/1.6 Futura, "Century Gothic", ui-sans-serif, system-ui, sans-serif;
  }
  b { font-size: 56px; letter-spacing: -0.02em; }
  a { color: #ab5340; }
  @media (prefers-color-scheme: dark) {
    body { background: #15151a; color: #e9e6dd; }
    a { color: #cd7357; }
  }
</style>
</head>
